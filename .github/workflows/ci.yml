name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    env:
      # `prisma generate` and prisma.config.ts only need the variable to exist; nothing connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      # The e2e suite boots the real AppModule with Prisma mocked, so it needs no database.
      - run: npm run test:e2e
      - run: npm run build
      # Warns (never fails) about translation keys missing in a locale; the API falls back to en.
      - run: npm run i18n:check

  migrations:
    name: Migrations apply and match schema.prisma
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Never run against the shared development database: this one is created and thrown away here.
      - run: npx prisma migrate deploy
      - name: Fail when schema.prisma has changes that no migration covers
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      # Real SQL: unique and CHECK constraints, the append-only audit trigger, serializable
      # transactions and the account flows over HTTP. The suite refuses anything but
      # TEST_DATABASE_URL, and this database is thrown away with the job.
      - run: npx prisma generate
      - name: Database-backed tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
