openapi: 3.0.3
info:
  title: AI engine internal API (subset used by the backend gateway, Phase 3)
  version: 0.1.0-draft
  description: |
    The part of the engine's internal API that the backend core calls to run a widget chat
    (team-alignment Appendix A, D1, D2, D7). **Status: proposed by the backend, to be reviewed by
    the AI engine owner.** Until the engine implements it the backend runs against an in-process
    mock that follows this file (`ENGINE_MODE=mock`, see README.md in this folder).

    Rules (D2):
    * Browsers never call this API. Only the backend does, over a private network.
    * Every call carries `Authorization: Bearer <INTERNAL_API_TOKEN>`, `X-Tenant-Id` and
      `X-Request-Id`. The engine takes the tenant **only** from `X-Tenant-Id`, never from a body,
      a query string or message content. A conversation that belongs to another tenant answers 404.
    * Commands carry `Idempotency-Key`. Repeating a command with the same key returns the original
      result and changes nothing (the backend retries once on a network error).
    * Errors always have the shape `{ statusCode, code, message }` (F5).
    * Ids are text UUIDs, timestamps are ISO-8601 UTC (`...Z`) (F7).

    Items marked **[proposed addition]** are not in Appendix A yet; they are needed for D7 and I5
    ("never drop the end customer") and are listed as questions in team-alignment.md.

    **Phase 4 additions (all [proposed addition], for the staff side):** list and count
    conversations, claim, release, resolve and store a human message, plus the fields a dashboard
    needs on a conversation (`assignedUserId`, `escalatedAt`, `summary`, `resolvedAt`,
    `resolvedBy`). Staff calls also carry `X-Acting-User-Id` and `X-Acting-Role` (for the engine's
    own audit; never a source of the tenant). The backend does the authorisation (only the assignee
    may reply, release or resolve) and checks it again with the engine's answer, so the engine must
    enforce "claim only when unassigned" atomically and answer 409 with the codes below.

    The events the engine pushes back are the other direction (engine calls the backend) and are
    described in [backend-events.openapi.yaml](backend-events.openapi.yaml).
servers:
  - url: http://engine.internal:4000
    description: Private network address (ENGINE_BASE_URL)
security:
  - internalToken: []
tags:
  - name: health
  - name: conversations
  - name: staff
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      security: []
      responses:
        '200':
          description: The engine is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /internal/conversations:
    get:
      tags: [staff]
      summary: List the tenant's conversations **[proposed addition]**
      description: |
        The staff queue and lists (dashboard, D6). Always limited to the tenant in `X-Tenant-Id`.
        `status` is a comma-separated list; `sort=escalatedAt` orders oldest first (the queue),
        the default is the latest message first. Paginated with `skip` / `take`
        (default 20, maximum 100).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ActingUserId'
        - $ref: '#/components/parameters/ActingRole'
        - name: status
          in: query
          description: Comma-separated statuses, for example `escalated,human_active`.
          schema: { type: string }
        - name: assignedUserId
          in: query
          schema: { type: string }
        - name: endCustomerId
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [lastMessageAt, escalatedAt]
            default: lastMessageAt
        - name: skip
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: take
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of conversations
          content:
            application/json:
              schema:
                type: object
                required: [data, total, skip, take]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  total: { type: integer }
                  skip: { type: integer }
                  take: { type: integer }
        '400':
          $ref: '#/components/responses/Error'
    post:
      tags: [conversations]
      summary: Create a conversation
      description: |
        Creates an `active` conversation for one end customer. With the same `Idempotency-Key`
        the original conversation is returned (200 instead of 201). `endCustomerId` is the
        backend's `end_customers.id` (B4, B5); the engine never stores contact details.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, endCustomerId]
              properties:
                channel:
                  $ref: '#/components/schemas/Channel'
                endCustomerId:
                  type: string
                locale:
                  type: string
                  description: Language the customer prefers (BCP-47, for example `en`, `ur`).
                  example: ur
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '200':
          description: Same Idempotency-Key as an earlier call; the original conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /internal/conversations/{id}:
    get:
      tags: [conversations]
      summary: Conversation detail with its messages
      description: Messages are oldest first, paginated with `skip` / `take` (default 20, maximum 100).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ConversationId'
        - name: skip
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: take
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: The conversation and a page of messages
          content:
            application/json:
              schema:
                type: object
                required: [conversation, messages]
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
                  messages:
                    type: object
                    required: [data, total, skip, take]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Message'
                      total: { type: integer }
                      skip: { type: integer }
                      take: { type: integer }
        '404':
          $ref: '#/components/responses/Error'
  /internal/conversations/{id}/messages:
    post:
      tags: [conversations]
      summary: Store a customer message and stream the AI reply
      description: |
        Stores the customer message (`author_type=customer`). If the conversation is `active` and
        `aiReply` is not `false`, the engine retrieves context, calls the model and **streams** the
        reply as server-sent events. In any other state (`escalated`, `human_active`, `resolved`)
        or with `aiReply: false` the AI stays silent (C4): the stream is just `accepted` and
        `done` with `aiReply: false`. The response is always `text/event-stream`.

        Events, in this order: `accepted` (once), then `token` (zero or more), optionally `usage`,
        optionally `escalated` (the engine decided to hand over, C6), then `done`. A failure
        after the stream started is an `error` event, followed by the end of the stream.

        The backend allows 5 seconds until the first `token`/`escalated`/`done` event and 30
        seconds in total (D7); after that it stops reading, answers the customer with the
        fallback message and escalates with reason `ai_unavailable`.

        Repeating the call with the same `Idempotency-Key` does not store the message again and
        does not call the model again: the stream replays `accepted`, the stored reply as one
        `token` event, and `done`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: "The customer's text (F6: 2,000 characters, enforced on both sides)."
                externalMessageId:
                  type: string
                  description: The caller's id for this message (C3). Unique per tenant and channel.
                aiReply:
                  type: boolean
                  default: true
                  description: |
                    **[proposed addition]** `false` stores the message without generating a reply.
                    The backend uses it when the tenant is over its plan limit (I5) so the customer's
                    message still reaches a human.
      responses:
        '200':
          description: Server-sent events
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: accepted
                data: {"messageId":"6c1f...","conversationStatus":"active"}

                event: token
                data: {"text":"Our "}

                event: token
                data: {"text":"opening hours are 9 to 6."}

                event: usage
                data: {"messageId":"b2e0...","tokensIn":182,"tokensOut":14,"model":"gemini-x","latencyMs":812}

                event: done
                data: {"messageId":"b2e0...","conversationStatus":"active","aiReply":true}
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: The conversation is resolved and accepts no more messages (`CONVERSATION_RESOLVED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/conversations/{id}/escalate:
    post:
      tags: [conversations]
      summary: Hand the conversation to a human **[proposed addition]**
      description: |
        Sets the status to `escalated` with the given reason, without calling the model. Used by
        the backend when it knows the AI must not answer: the plan limit is reached
        (`limit_reached`, I5) or the engine itself was slow or failing (`ai_unavailable`, D7).
        Repeating it on an already escalated or `human_active` conversation changes nothing and
        answers 200 (idempotent). A `resolved` conversation answers 409.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  $ref: '#/components/schemas/EscalationReason'
                summary:
                  type: string
                  maxLength: 1000
                  description: Optional handoff note shown to the human.
      responses:
        '200':
          description: The conversation after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /internal/conversation-counts:
    get:
      tags: [staff]
      summary: Number of conversations per status **[proposed addition]**
      description: |
        For the sidebar badge. All four statuses are always present. `assignedUserId` narrows it
        to the conversations one staff member holds.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ActingUserId'
        - $ref: '#/components/parameters/ActingRole'
        - name: assignedUserId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCounts'
  /internal/conversations/{id}/claim:
    post:
      tags: [staff]
      summary: A staff member takes the conversation **[proposed addition]**
      description: |
        **Atomic** (C4): succeeds only when the status is `active` or `escalated` and nobody is
        assigned; the conversation becomes `human_active` with `assignedUserId = userId`, the AI
        stops answering, a system line `agent.joined` is stored and `conversation.assigned` is
        emitted. Otherwise 409: `CONVERSATION_ALREADY_CLAIMED` (somebody holds it, possibly the
        caller) or `CONVERSATION_RESOLVED`. With the same Idempotency-Key a retry of a claim that
        succeeded answers 200 with the same conversation, not 409.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ActingUserId'
        - $ref: '#/components/parameters/ActingRole'
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  description: The staff member's `tenant_user.id` (the backend verified it).
      responses:
        '200':
          description: The conversation after the claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /internal/conversations/{id}/release:
    post:
      tags: [staff]
      summary: The assignee gives the conversation back **[proposed addition]**
      description: |
        `to: active` lets the AI answer again, `to: escalated` puts it back in the queue (it keeps
        its original `escalatedAt`), `to: resolved` closes it (same as `/resolve`; this is the
        value Appendix A already listed). The status must be `human_active` and `userId` the
        assignee, otherwise 409 `CONVERSATION_NOT_ASSIGNED_TO_YOU` (or `CONVERSATION_RESOLVED`).
        `force: true` skips the assignee check; the backend sets it **only** to release the
        conversations of a staff member who was disabled or deleted (`to: escalated`). A system
        line `agent.left` is stored and `conversation.released` is emitted.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ActingUserId'
        - $ref: '#/components/parameters/ActingRole'
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, to]
              properties:
                userId: { type: string }
                to:
                  $ref: '#/components/schemas/ReleaseTarget'
                force: { type: boolean, default: false }
                reason:
                  type: string
                  description: Free tag for the engine's log, for example `assignee_disabled`.
      responses:
        '200':
          description: The conversation after the release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /internal/conversations/{id}/resolve:
    post:
      tags: [staff]
      summary: The assignee closes the conversation **[proposed addition]**
      description: |
        Sets `resolved`, `resolvedAt`, `resolvedBy: human`, clears the assignee, stores the
        system line `resolved.notice` and emits `conversation.resolved`. Same preconditions and
        409 codes as `release` (without `force`). A resolved conversation accepts no more
        messages (409 `CONVERSATION_RESOLVED`).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ActingUserId'
        - $ref: '#/components/parameters/ActingRole'
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200':
          description: The conversation after resolving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /internal/conversations/{id}/human-messages:
    post:
      tags: [staff]
      summary: Store a staff reply **[proposed addition]**
      description: |
        Stores a message with `author_type=human` and `author_user_id` (C2), role `assistant` for
        the model's context. Only the assignee of a `human_active` conversation may (409
        `CONVERSATION_NOT_ASSIGNED_TO_YOU`, `CONVERSATION_RESOLVED`). No AI reply is generated.
        Emits `message.created` (with the text, because the customer may see it). The backend
        limits the text to 2,000 characters; the engine enforces it as well (F6).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ActingUserId'
        - $ref: '#/components/parameters/ActingRole'
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, content]
              properties:
                userId: { type: string }
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: The stored message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      description: INTERNAL_API_TOKEN, one long random secret per environment, shared by backend and engine.
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string }
      description: The tenant the call is for. The engine's only source of the tenant.
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string }
      description: Correlation id created at the gateway; include it in every log line (F3).
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
      description: Makes a command safe to repeat. Scoped to the tenant.
    ConversationId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ActingUserId:
      name: X-Acting-User-Id
      in: header
      required: false
      schema: { type: string }
      description: The staff member the call is made for (staff calls, Phase 4). For the engine's audit only.
    ActingRole:
      name: X-Acting-Role
      in: header
      required: false
      schema: { type: string, enum: [owner, admin, agent] }
      description: Their role at the time of the call. For the engine's audit only.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [statusCode, code, message]
      properties:
        statusCode: { type: integer }
        code:
          type: string
          example: CONVERSATION_NOT_FOUND
        message: { type: string }
    Channel:
      type: string
      enum: [widget, whatsapp, voice]
    ReleaseTarget:
      type: string
      enum: [active, escalated, resolved]
    ResolvedBy:
      type: string
      enum: [ai, human, customer, system]
    ConversationCounts:
      type: object
      required: [active, escalated, human_active, resolved]
      properties:
        active: { type: integer }
        escalated: { type: integer }
        human_active: { type: integer }
        resolved: { type: integer }
    ErrorCodes:
      description: |
        Codes of 409 answers on the staff calls (documentation only). The backend maps them to its
        own stable codes of the same names.
      type: string
      enum:
        - CONVERSATION_ALREADY_CLAIMED
        - CONVERSATION_RESOLVED
        - CONVERSATION_NOT_ASSIGNED_TO_YOU
    ConversationStatus:
      type: string
      enum: [active, escalated, human_active, resolved]
    EscalationReason:
      type: string
      description: |
        Stable codes (the dashboard translates them). `ai_unavailable` and `limit_reached` are
        set by the backend; the others by the engine (C6).
      enum:
        - customer_requested
        - low_confidence
        - failed_action
        - sentiment
        - topic
        - outside_hours
        - ai_unavailable
        - limit_reached
        - other
    Conversation:
      type: object
      required: [id, channel, endCustomerId, status, createdAt]
      properties:
        id: { type: string }
        channel:
          $ref: '#/components/schemas/Channel'
        endCustomerId:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ConversationStatus'
        escalationReason:
          allOf:
            - $ref: '#/components/schemas/EscalationReason'
          nullable: true
        createdAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        assignedUserId:
          type: string
          nullable: true
          description: '**[proposed addition]** The staff member handling it (`human_active`). The engine stores the id; the backend resolves the name.'
        escalatedAt:
          type: string
          format: date-time
          nullable: true
          description: '**[proposed addition]** When it was escalated, for the queue order.'
        summary:
          type: string
          nullable: true
          description: '**[proposed addition]** The handoff note written on escalation (C1).'
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolvedBy:
          allOf:
            - $ref: '#/components/schemas/ResolvedBy'
          nullable: true
    Message:
      type: object
      required: [id, conversationId, authorType, content, createdAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        authorType:
          type: string
          enum: [customer, ai, human, system, tool]
        authorUserId:
          type: string
          nullable: true
          description: Staff user id when `authorType` is `human`. The backend never forwards it to a widget.
        content:
          type: string
          description: Text. For `system` lines the engine sends a `contentKey` instead and an empty text.
        contentKey:
          type: string
          nullable: true
          description: Translation key for system lines such as `widget.agent.joined` (the engine emits keys, not English).
        createdAt: { type: string, format: date-time }
    StreamEvents:
      description: |
        Documentation only (OpenAPI cannot describe SSE): the `data` payload of each event name.
      type: object
      properties:
        accepted:
          type: object
          required: [messageId, conversationStatus]
          properties:
            messageId: { type: string, description: Id of the stored customer message. }
            conversationStatus:
              $ref: '#/components/schemas/ConversationStatus'
        token:
          type: object
          required: [text]
          properties:
            text: { type: string }
        usage:
          type: object
          required: [messageId, tokensIn, tokensOut]
          properties:
            messageId: { type: string, description: Id of the assistant message the tokens belong to. }
            tokensIn: { type: integer }
            tokensOut: { type: integer }
            model: { type: string }
            latencyMs: { type: integer }
        escalated:
          type: object
          required: [reason]
          properties:
            reason:
              $ref: '#/components/schemas/EscalationReason'
            summary: { type: string }
        done:
          type: object
          required: [conversationStatus, aiReply]
          properties:
            messageId:
              type: string
              nullable: true
              description: Id of the assistant message; null when no AI reply was produced.
            conversationStatus:
              $ref: '#/components/schemas/ConversationStatus'
            aiReply: { type: boolean }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
