openapi: 3.0.3
info:
  title: Backend internal API (called by the AI engine, voice-first) - DRAFT
  version: 0.1.0-draft
  description: |
    The routes of the backend core that the AI engine calls to ASK or COMMAND (the other direction
    of [engine-internal.openapi.yaml](engine-internal.openapi.yaml)), for the voice-first product
    (team-alignment L4, M1; Abdullah's duties B1, B4 and B11). The events the engine PUSHES are in
    [backend-events.openapi.yaml](backend-events.openapi.yaml) (`record.submitted` and
    `record.updated` are handled since Phase 5B-2; `usage.call_minutes` is acknowledged and ignored
    until Phase 5E; `handoff.requested` and `handoff.unavailable` are acknowledged and ignored).

    **Status: drafted in Phase 5A (2026-10-21), extended in Phase 5B-1 (2026-10-28), BUILT in
    Phases 5B-1, 5B-2 and 5B-3 (2026-10-29): the agent config pull, the agent list, the tenant
    status check, the requests (create, update, withdraw; appointment, call-back and order) and
    the customer upsert exist in the backend and are tested against the mock engine and real
    Postgres. Abdullah has NOT seen this file and has confirmed none of the shapes (Q28 to Q31),
    so every route below is a PROPOSAL that is built, not an agreed contract.** Only the number
    lookup (`/internal/numbers/{e164}`, Phase 5D) is still a draft: since 2026-10-29 (engine
    first, L8 revised) it is **the route the engine calls on every inbound call**, and it says
    NOT BUILT in its summary. The shapes follow what he described in his handoff (his names
    where known: `serviceable`, `reason`, `submissionKey`, `locked`, `record.submitted`) and
    are PROPOSALS where he did not say. Phase 5B-3 compared every field he sends with what these
    routes accept: [README.md](README.md) has the table "What Abdullah must adapt to". Questions
    for him are collected under "Open questions" at the end of this description.

    Rules (the same as the engine contract, reversed):
    * **Private network only.** Never routed to the internet; the public API is `/v1`.
    * `Authorization: Bearer <INTERNAL_API_TOKEN>` (one long random secret per environment, the same
      one that signs the events), `X-Request-Id` for correlation. Wrong or missing token: 401. No
      token configured on the backend: 503.
    * **The tenant is in the path** (`/internal/tenants/{tenantId}/...`), because the engine learns it
      from the backend (`GET /internal/numbers/{e164}`) and states it on every call. (His handoff
      sketches `/internal/records` and `/internal/customers/by-phone/{phone}` without a tenant; the
      tenant in the path is decided, N2.2.) The backend checks that the tenant exists and scopes
      every query to it; an id of another tenant in a body is never a way to reach that tenant's
      rows (a reference or an id of another tenant answers 404).
    * **Agents (team-alignment L7, decided 2026-10-28).** A tenant has many agents (the tenant's own
      setup the one shared engine uses for a call: settings, knowledge, hours, greeting, voice,
      forwarding contacts), every number belongs to exactly one agent, and every tenant has one
      default agent. Every operation that concerns a call, a request or a customer carries
      `agentId`: in the path of the config route, as `?agentId=` on the status check, in the body
      of a request and of the customer upsert. The engine sends the same id as `X-Agent-Id` on its
      own routes and in its events (`agentId` in `data`). Until the engine is agent-aware (Q28) an
      absent `agentId` means "the tenant's default agent".
    * **The telephone call is the ENGINE's (engine first, decided 2026-10-29, L8 revised).** The
      engine answers the telephone provider's webhook on its own public address, verifies the
      provider's signature, asks the backend which business and agent the dialled number rings
      (`GET /internal/numbers/{e164}`, Phase 5D) and whether that business may be served now
      (`GET /internal/tenants/{tenantId}/status`), and issues its own one-minute single-use call
      ticket. **The backend signs no ticket and needs no ticket secret**; it only says who a
      number belongs to. At the start of the call the engine PULLS the agent's settings with
      `GET /internal/tenants/{tenantId}/agents/{agentId}/config` (the settings hold forwarding
      phone numbers, so they never travel in a ticket, a URL or through the provider). A test call
      from the dashboard goes the other way: the backend asks the ENGINE for a one-minute browser
      ticket (`POST /api/voice/session`, his route, Phase 5D); see engine-internal.openapi.yaml.
    * Commands carry `Idempotency-Key` where a repeat must be harmless; a request has its own
      `submissionKey` for that.
    * Errors have the shape `{ statusCode, code, message }` (plus `requestId`, and `details` where
      noted); codes are stable upper-case words. **This differs from the engine's own errors, which
      are `{ "error": "<translated message>" }`**: the engine reads the status code and `code`, it
      does not show `message` to a caller. His word `locked` is the code `REQUEST_LOCKED` here and
      `reference_taken` is `REQUEST_REFERENCE_TAKEN`.
    * Ids are text UUIDs, timestamps ISO-8601 UTC, money integer minor units.
    * Nothing here carries what a caller said beyond the fields named below, and the backend never
      logs request details or phone numbers.

    **Open questions for the engine owner (all proposals):**
    1. The status check: which `reason` should a tenant get whose plan has no voice (only possible
       through an override) or whose payment is overdue (`past_due` keeps serving within the plan,
       like chat, I5)? Built: `quota_exceeded` when the call minutes are used up and overage does
       not apply (no price, the owner switched it off, or a payment is overdue) and also for a
       plan without voice; `unpaid` is reserved and never answered.
    2. The status check carries `Cache-Control: private, max-age=10`: the backend asks the engine to
       keep an answer at most **10 seconds** (decided 2026-10-29 on our side; your handoff says
       about 60). Calls that start inside the window can overshoot the minute allowance a little.
       Acceptable (a soft limit)? And does the engine really call it per call, not per request?
    3. The request body: is `data` free-form JSON validated by the engine only (built: any JSON
       object up to 16 KB, stored as is)? Does `record.submitted` carry ids and the reference only
       (built: the backend ignores any other field in it and reads the request it already holds)?
    4. A caller's phone number as the identity of an end customer (privacy rules, F1): built as the
       end customer's external id (`phone_+9230...`), shown to every staff role, never logged and
       never put in a URL.
    5. Who calls the daily retention purge route of the engine (the backend's hourly job, proposed).
    6. **New in 5B-2.** The status check answers two reasons that are not in your list:
       `agent_disabled` and `unknown_agent` (an agent id that does not exist OR belongs to another
       tenant: one answer, so nothing about other tenants leaks), and a field `overage` (true when
       the call is served only because extra minutes are billed). Will the engine accept them (an
       unknown reason treated as "not serviceable, 403")?
    7. **New in 5B-2.** Reference collisions: the engine draws the reference (`AP-4K7Q2`), the
       backend answers 409 `REQUEST_REFERENCE_TAKEN` when another request of the tenant already has
       it, and the engine draws another and repeats the create with the SAME `submissionKey`. Is that
       how the engine will behave? (At 5 characters from a 31-letter alphabet a collision is about
       1 in 28 million per pair.)
    8. **New in 5B-2.** Which is the source of truth for a request: these routes (built) or the
       `record.*` events? Built: the routes. The events `record.submitted` and `record.updated` only
       make sure the team was told (notification and live update are once-only), never create or
       change a request.
    9. **New in 5B-3.** The settings document: the backend keeps every key it does not know exactly
       as the dashboard sent it and hands it back (so a field you add tomorrow needs no change
       here), and checks only the structure of the fields you listed in your handoff (greeting,
       recordCalls, autoEndCalls, endCallDelaySeconds, profileSummary, profileSummarySources,
       escalation.announce) with your own limits. Does the dashboard save the document whole through
       the backend (built) while you keep deeper validation (`collect`, capability and voice ids)?
       Will you offer the validation route you mentioned (`POST /api/agent-config/validate`)?
    10. **New in 5B-3.** `order` is accepted as a third request type (reference prefix `OR-`,
        `data` stored as you send it; prices and the total are not in it, the team confirms them).
        The request routes need the `endCustomerId` the customer upsert returned; a caller with no
        number (an email-only request) is upserted with no `phone` and gets a customer of their
        own each time. Is that what you want?
    11. **New in 5B-3.** `GET /internal/tenants/{tenantId}/agents` lists the tenant's agents
        (`agentId`, `name`, `status` `active` or `disabled`, `isDefault`, default first); your
        `archived` is our `disabled`. Our default agent MAY be disabled (it cannot be deleted);
        what does a call to a disabled default agent do on your side? (Ours: the status check
        answers `agent_disabled`.)
tags:
  - name: agents
  - name: status
  - name: requests
  - name: customers
  - name: numbers
servers:
  - url: http://backend.internal:3000
    description: Private address of the backend. Both services default to port 3000 - run one of them elsewhere.
security:
  - internalToken: []
paths:
  /internal/tenants/{tenantId}/agents:
    get:
      tags: [agents]
      summary: "The tenant's agents, for the engine (his B2; IMPLEMENTED in Phase 5B-3, not confirmed by the engine owner)"
      description: |
        **Built (Phase 5B-3).** The list the engine reads to learn which agents a business has (his
        `GET /internal/tenants/{tenantId}/agents`): the default agent first, then by age. It carries
        names, ids, the status and the default flag only; the settings are a separate pull (below),
        so no forwarding phone number is here.

        * `Authorization: Bearer <INTERNAL_API_TOKEN>` (401 wrong or missing, 503 not configured).
        * The tenant is the path segment. An unknown tenant answers **404 `TENANT_NOT_FOUND`** (every
          tenant has a default agent, so an empty list cannot mean "no agents"; the other internal
          routes answer an unknown tenant the same way, except the status check, which is a normal
          200 `unknown_tenant`).
        * `status` is `active` or `disabled`: our word for what his handoff calls `archived` (a
          disabled agent answers no call but is kept; the default agent may be disabled, it cannot be
          deleted).
        * Answered live (no cache header); rate limited per tenant (600 a minute): 429 with
          `Retry-After`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The tenant's agents
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentSummary'
              examples:
                two:
                  value:
                    agents:
                      - { agentId: 8c1d2b6e-0a3f-4c44-8d5e-5d0f7a9b0002, name: Acme Dental, status: active, isDefault: true }
                      - { agentId: 3b7a9d10-5c2e-4f6a-9a41-77c0d2e8a003, name: Lahore branch, status: disabled, isDefault: false }
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/agents/{agentId}/config:
    get:
      tags: [agents]
      summary: 'The settings of an agent, pulled by the engine at the start of every call (L7; IMPLEMENTED in Phase 5B-1)'
      description: |
        **Built.** The backend owns each agent's settings and versions them; the engine pulls the
        current version at the start of every call (a browser test call too) and may keep it for up
        to 60 seconds (`Cache-Control: private, max-age=60`; if the backend is briefly unreachable
        it may serve the copy it holds for that version).

        * `Authorization: Bearer <INTERNAL_API_TOKEN>`, compared in constant time. No token
          configured on the backend: 503. Wrong or missing: 401.
        * The tenant is the path segment and the agent must belong to it. An agent of another
          tenant, an unknown agent and an unknown tenant all answer the same **404
          `AGENT_NOT_FOUND`**.
        * `?version=n` returns that past version of the agent's settings (the version a call
          ticket names); an unknown one is 404 `AGENT_SETTINGS_VERSION_NOT_FOUND`, a malformed one
          400. Without it, the current (highest) version.
        * A **disabled** agent answers **200** with `status: "disabled"` (and its settings), so the
          engine can play the "not available" message and take no call.
        * `ETag` changes with the version and the status; an `If-None-Match` that matches answers
          **304** with no body.
        * Rate limited per tenant (600 a minute): 429 with `Retry-After`.
        * The body holds forwarding phone numbers: neither side logs it.

        `config` is the document in the engine's shape (the backend stores it, checks its structure
        when staff save it and does not interpret `collect`). **A key the backend does not know is
        kept exactly as it was saved and returned here (Phase 5B-3)**, at the top of the document
        and inside `escalation`; the optional keys of his handoff (`greeting`, `recordCalls`,
        `autoEndCalls`, `endCallDelaySeconds`, `profileSummary`, `profileSummarySources`,
        `escalation.announce`) are absent until an owner sets them, and the engine's own defaults
        apply then. His handoff puts `agentId`, `name`, `status` and `isDefault` inside
        `config`; here they are beside it (`agentId`, `status`; the name and the default flag
        are in the list route above). His "no agentId means the default agent" is the list route's
        `isDefault`: ask for the list, then for the default's config.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/RequestId'
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: A past settings version to read instead of the current one.
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The agent's settings
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: 'private, max-age=60' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfig'
              examples:
                active:
                  value:
                    tenantId: 2f1c0c3e-6f0b-4a35-9c58-1f3c8c1d0001
                    agentId: 8c1d2b6e-0a3f-4c44-8d5e-5d0f7a9b0002
                    version: 3
                    status: active
                    config:
                      businessName: Acme Dental
                      purpose: Answer calls and take appointment requests.
                      tone: friendly
                      timezone: Asia/Karachi
                      uiLocale: en
                      replyLanguage: ur
                      hours:
                        mon: [['09:00', '17:00']]
                        tue: [['09:00', '17:00']]
                        wed: [['09:00', '17:00']]
                        thu: [['09:00', '17:00']]
                        fri: [['09:00', '17:00']]
                        sat: []
                        sun: []
                      escalation:
                        enabled: true
                        contacts: [{ id: c1, role: Senior doctor, name: Dr Ayesha, phone: '+923001234567' }]
                        whenCallerAsks: true
                        afterMisses: 2
                        topics: [emergency]
                        outsideHours: callback
                      capabilities: {}
                      voices: {}
                      collect: null
        '304':
          description: Unchanged since the `ETag` the engine sent (no body)
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/status:
    get:
      tags: [status]
      summary: 'May this business and agent be served right now? (his B1; IMPLEMENTED in Phase 5B-2, not confirmed by the engine owner)'
      description: |
        **Built (Phase 5B-2).** Asked by the engine before it serves a call for the tenant; the
        engine may keep the answer for at most **10 seconds** (`Cache-Control: private,
        max-age=10`) and answers its own caller accordingly (403, 429 or 404). The route itself
        answers LIVE (it skips the backend's own 30 s entitlements cache). Derived by the backend
        ONLY from the EFFECTIVE subscription (`SubscriptionService.getEffective`, through
        `EntitlementsService`) and the agent's status; the denormalised `tenants.plan` and
        `tenants.status` columns are never read to decide (CLAUDE.md rule 10).

        * `Authorization: Bearer <INTERNAL_API_TOKEN>` (401 wrong or missing, 503 not configured).
        * Rate limited per tenant (1,200 a minute): 429 with `Retry-After`.
        * Nothing personal is read or logged.

        The checks run in this order and the first that fails decides:

        | order | `reason` | When |
        |---|---|---|
        | 1 | `unknown_tenant` | no such tenant (`plan: null`, `agentId: null`) |
        | 2 | `suspended` | the tenant is suspended or its account is closed (also, impossibly, a tenant without a subscription: fail closed) |
        | 3 | `unknown_agent` | `?agentId=` names an agent that does not exist **or belongs to another tenant** (one answer for both; `agentId: null`), or the tenant has no default agent |
        | 4 | `agent_disabled` | the agent exists in this tenant and is `disabled` (`agentId` is echoed) |
        | 5 | `quota_exceeded` | the plan has no voice, or the included call minutes are used up and overage does not apply (the plan has no minute price, the owner switched overage off, or a payment is overdue) |
        | - | `unpaid` | **reserved; never answered today** (a tenant that does not renew is served within its plan during the grace period and falls to Free afterwards) |
        | - | `null` | `serviceable: true` |

        `?agentId=` names the agent the call is for (default: the tenant's default agent, which is
        returned in `agentId`). Whether one more minute may be served is
        `EntitlementsService.check(tenant, 'callMinutes')`: a tenant that used exactly its included
        minutes is no longer serviceable; with overage on (Pro, the owner's switch) it is still
        serviceable and `overage: true` says the extra minutes are billed. A `past_due` tenant is
        served within its allowance and never into overage.

        An unknown tenant is a normal **200** with `reason: unknown_tenant`: the answer leaks
        nothing about other tenants and the engine can cache it like any other.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdQuery'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The answer (also for an unknown tenant)
          headers:
            Cache-Control: { schema: { type: string, example: 'private, max-age=10' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStatus'
              examples:
                serviceable:
                  value: { tenantId: 2f1c0c3e-6f0b-4a35-9c58-1f3c8c1d0001, agentId: 8c1d2b6e-0a3f-4c44-8d5e-5d0f7a9b0002, serviceable: true, reason: null, plan: pro, overage: false }
                servedAsOverage:
                  value: { tenantId: 2f1c0c3e-6f0b-4a35-9c58-1f3c8c1d0001, agentId: 8c1d2b6e-0a3f-4c44-8d5e-5d0f7a9b0002, serviceable: true, reason: null, plan: pro, overage: true }
                outOfMinutes:
                  value: { tenantId: 2f1c0c3e-6f0b-4a35-9c58-1f3c8c1d0001, agentId: 8c1d2b6e-0a3f-4c44-8d5e-5d0f7a9b0002, serviceable: false, reason: quota_exceeded, plan: free, overage: false }
                unknownAgent:
                  value: { tenantId: 2f1c0c3e-6f0b-4a35-9c58-1f3c8c1d0001, agentId: null, serviceable: false, reason: unknown_agent, plan: pro, overage: false }
                unknownTenant:
                  value: { tenantId: 00000000-0000-0000-0000-000000000000, agentId: null, serviceable: false, reason: unknown_tenant, plan: null, overage: false }
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/requests:
    post:
      tags: [requests]
      summary: 'Save a request the agent took on a call (his B4; IMPLEMENTED in Phase 5B-2, not confirmed by the engine owner)'
      description: |
        **Built (Phase 5B-2).** The AI never books, confirms or cancels anything (L1): it saves a
        request as `requested` and a person confirms it on the staff screen. This route is the
        SOURCE OF TRUTH for a request (it carries the details); the `record.*` events only
        confirm to the backend that the team was told.

        Idempotent by `(tenant, submissionKey)`: the first call answers **201** with `created: true`;
        a repeat with the same key answers **200** with `created: false` and the SAME stored request
        (nothing is changed, duplicated or announced again; the body of the repeat is ignored,
        so a retry may even carry a different reference). Ten parallel saves of one call are one
        request.

        The `reference` (for example `AP-4K7Q2`, trimmed and stored upper case, 3 to 40 letters,
        digits and hyphens) is drawn by the engine and unique per tenant. If another request of the
        tenant already has it the answer is **409 `REQUEST_REFERENCE_TAKEN`**: the engine draws
        another reference and repeats the call with the SAME `submissionKey`.

        The tenant is the path segment. The agent (default: the tenant's default agent) and the
        caller (`endCustomerId` from the customer upsert) are looked up UNDER the tenant: an
        agent of another tenant answers 404 `AGENT_NOT_FOUND`, a customer of another tenant 404
        `CUSTOMER_NOT_FOUND`, an unknown tenant 404 `TENANT_NOT_FOUND` (the composite foreign keys
        in the database are the second lock). A request is accepted for a DISABLED agent and for a
        tenant that has since been suspended: the call already happened and the caller's request is
        not thrown away.

        `data` is any JSON object up to 16 KB, stored as is (the engine owns the field list; the
        backend does not interpret it). The request's contents are personal data: the backend
        never logs them, and its notification, live update and audit entries carry ids only.

        On success, in one transaction, every ACTIVE staff member of the tenant gets a
        `request.submitted` notification (once per request), and after the commit the dashboard
        stream gets a `request.created` event (ids and status only). Rate limited per tenant (600
        a minute): 429.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResult'
        '200':
          description: The same `submissionKey` was saved before; the original request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/requests/{reference}:
    patch:
      tags: [requests]
      summary: 'Change the details of a saved request (his B4; IMPLEMENTED in Phase 5B-2, not confirmed by the engine owner)'
      description: |
        **Built (Phase 5B-2).** The engine may change a request ONLY while it is `requested`. Once
        a person confirmed, completed or cancelled it, the answer is **409 `REQUEST_LOCKED`** (his
        word: `locked`) and nothing changes. The write is a conditional update (`WHERE tenant AND
        reference AND status = 'requested'`), so a confirmation that happens at the same moment
        wins and the engine's update is refused; it is never both. `summary` and
        `scheduledLocal` replace the stored values, `data` replaces the stored document (like
        his own update); at least one of the three is required (400 otherwise). The reference is
        looked up under the tenant and in any letter case; an unknown one, or one of another
        tenant, answers 404 `REQUEST_NOT_FOUND`. `Idempotency-Key` is accepted and ignored (the
        same update twice has the same result). The engine also sends `record.updated`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequestDetails'
      responses:
        '200':
          description: The request after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/requests/{reference}/withdraw:
    post:
      tags: [requests]
      summary: 'The caller withdraws a request (his B4; IMPLEMENTED in Phase 5B-2, not confirmed by the engine owner)'
      description: |
        **Built (Phase 5B-2).** Moves a `requested` request to `cancelled`, marked as cancelled by
        the caller (the staff screen shows who cancelled it). Same locking rule as the update: 409
        `REQUEST_LOCKED` once a person acted on it, including a request that a person cancelled.
        Repeating it on a request that the caller already withdrew answers 200 (idempotent). The
        optional `reason` is kept as the request's note for the staff screen.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
                  description: Short tag for the staff screen, not the caller's words.
      responses:
        '200':
          description: The request after withdrawing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/customers/by-phone:
    put:
      tags: [customers]
      summary: 'Find or create the end customer for a caller number (his B4, L4.3; IMPLEMENTED in Phase 5B-2, not confirmed by the engine owner)'
      description: |
        **Built (Phase 5B-2).** The backend creates end customers (L4.3, M3.7). Upsert by the
        caller's number within the tenant: the first call creates the customer (**201**), later
        calls return the same `endCustomerId` (**200**; ten parallel calls for one number make one
        customer). The name and language are only filled in when the customer has none yet (a staff
        member may have corrected them). The number must be E.164 (anything else is 400 and is not
        echoed back). It is personal data (F1): it is stored as the customer's external id
        (`phone_+923001234567`), shown to every staff role, never logged and never put in a URL (it
        is in the body). An agent of another tenant answers 404 `AGENT_NOT_FOUND`, an unknown
        tenant 404 `TENANT_NOT_FOUND`. The same number in two tenants is two customers.

        **No number (Phase 5B-3).** `phone` may be left out (his own rule: a request with no phone,
        an email-only appointment, makes a customer row of its own; an address is not reliable
        enough to merge two people on): the answer is always **201** with a NEW customer (external
        id `call_<uuid>`), never merged. His body also has `email`: the backend ignores it (an end
        customer has no email column; the address stays in the request's `data`). Unknown fields
        are ignored, not refused.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                  description: The agent whose call this is (default the tenant's default agent). An agent of another tenant answers 404 `AGENT_NOT_FOUND`.
                phone:
                  type: string
                  pattern: '^\+[1-9][0-9]{6,14}$'
                  example: '+923001234567'
                  description: 'E.164. Optional (Phase 5B-3): without it the caller is a new customer of their own every time.'
                name:
                  type: string
                  maxLength: 200
                locale:
                  type: string
                  example: ur
      responses:
        '200':
          description: The customer (existing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResult'
        '201':
          description: The customer (created now)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /internal/numbers/{e164}:
    get:
      tags: [numbers]
      summary: '[NOT BUILT, Phase 5D] The route the engine calls on EVERY inbound call: which business and agent own this phone number? (his B11; engine first, L8 revised 2026-10-29)'
      description: |
        **NOT BUILT (Phase 5D); this is the contract the route will follow.** Under engine-first
        routing (decided 2026-10-29) the ENGINE answers the telephone provider's webhook, verifies
        the provider's signature and then asks this route which business and agent the dialled
        number rings (his `resolveDialledNumber`; its stand-in table becomes this call). The tenant
        is therefore never taken from anything the caller supplies. The backend owns the numbers
        (the `phone_numbers` table, each number linked to exactly one agent of its own tenant, the
        plan limit, purchase and release) and **only says who a number belongs to**: it signs no call
        ticket. The status check stays a separate call (`GET /internal/tenants/{tenantId}/status`).

        * `Authorization: Bearer <INTERNAL_API_TOKEN>`; the `+` of the number must be sent as `%2B`
          in the path; rate limited.
        * **200** for every number the backend ever held: `{ tenantId, agentId, numberId, status }`.
          `status` is `active` or `released` (a released number keeps its row and the engine
          refuses the call); `agentId` is null for a number linked to no agent (the engine refuses
          that too). The engine applies those rules to the answer; the backend answers from the
          table only and never guesses.
        * **404 `NUMBER_NOT_FOUND`** for a number the backend never held; it reveals nothing about
          other tenants.
        * How his refusals map to ours (his reasons are his; the backend only returns data): his
          `unknown` = the 404; `released` = `status: released`; `unassigned` = `agentId: null`;
          `agent_archived` = the agent's status is `disabled` (the engine reads it from the agent
          list or the status check; the status check answers `agent_disabled`);
          `tenant_unserviceable` = the status check (`suspended`, `quota_exceeded`, ...);
          `invalid_number` = a malformed number, which the engine refuses before asking (here a
          400).
        * Written to refuse at write time what the engine refuses at call time: a number without a
          country code, an agent of another tenant, a disabled agent.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: e164
          in: path
          required: true
          schema:
            type: string
            pattern: '^\+[1-9][0-9]{6,14}$'
          example: '%2B923001234567'
      responses:
        '200':
          description: The tenant that owns the number
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, agentId, numberId, status]
                properties:
                  tenantId: { type: string }
                  agentId:
                    type: string
                    nullable: true
                    description: 'The one agent the number is linked to (L7); null when it is linked to none.'
                  numberId: { type: string, description: 'The backend id of the number (the engine stamps its call logs with it).' }
                  status: { type: string, enum: [active, released] }
              examples:
                active:
                  value: { tenantId: 2f1c0c3e-6f0b-4a35-9c58-1f3c8c1d0001, agentId: 8c1d2b6e-0a3f-4c44-8d5e-5d0f7a9b0002, numberId: 5a6b7c8d-1e2f-4a3b-9c4d-0e1f2a3b4c5d, status: active }
                released:
                  value: { tenantId: 2f1c0c3e-6f0b-4a35-9c58-1f3c8c1d0001, agentId: 8c1d2b6e-0a3f-4c44-8d5e-5d0f7a9b0002, numberId: 5a6b7c8d-1e2f-4a3b-9c4d-0e1f2a3b4c5d, status: released }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      description: INTERNAL_API_TOKEN, one long random secret per environment, shared by backend and engine.
  parameters:
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema: { type: string }
      description: The agent (the tenant's own setup) the call is for. It must belong to the tenant in the path.
    AgentIdQuery:
      name: agentId
      in: query
      required: false
      schema: { type: string }
      description: The agent the call is for; default the tenant's default agent.
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
      description: The tenant the call is about (an id the backend gave the engine).
    Reference:
      name: reference
      in: path
      required: true
      schema: { type: string, example: AP-4K7Q2 }
      description: The request's reference, unique per tenant.
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string }
      description: Correlation id; include it in every log line.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
      description: Makes a command safe to repeat. Scoped to the tenant.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [statusCode, code, message]
      properties:
        statusCode: { type: integer }
        code:
          type: string
          example: REQUEST_LOCKED
        message: { type: string }
    TenantStatus:
      type: object
      required: [tenantId, agentId, serviceable, reason, plan, overage]
      properties:
        tenantId: { type: string }
        agentId:
          type: string
          nullable: true
          description: The agent the answer is about (the default agent when none was asked for); null for an unknown tenant, an unknown agent and a suspended tenant.
        serviceable: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [suspended, unpaid, quota_exceeded, agent_disabled, unknown_agent, unknown_tenant, null]
        plan:
          type: string
          nullable: true
          example: pro
          description: The plan code (`starter`, `free`, `pro`, `enterprise`); null for an unknown tenant.
        overage:
          type: boolean
          description: true when the call is served only because the included call minutes are used up and extra minutes are billed (Pro with the owner's switch on). Always false when not serviceable.
    AgentSummary:
      type: object
      required: [agentId, name, status, isDefault]
      properties:
        agentId: { type: string }
        name: { type: string, maxLength: 80 }
        status:
          type: string
          enum: [active, disabled]
          description: 'Our word for his `archived`: a disabled agent answers no call but is kept.'
        isDefault: { type: boolean, description: 'Exactly one agent per tenant is the default (it may be disabled, never deleted).' }
    AgentConfig:
      type: object
      required: [tenantId, agentId, version, status, config]
      properties:
        tenantId: { type: string }
        agentId: { type: string }
        version: { type: integer, minimum: 1, description: 'The settings version this config is.' }
        status:
          type: string
          enum: [active, disabled]
        config:
          type: object
          additionalProperties: true
          description: |
            The engine's document (its agent_configs fields). The backend checks the structure
            when staff save it; the checklist collect, the capabilities and the voice ids are
            validated by the engine and stored as they are. **The engine owns the field list:** a
            key listed below is checked structurally, any other key (for example `collectVersion`,
            or a field added tomorrow) is stored and returned exactly as sent, inside the 64 KB
            limit of the whole document (Phase 5B-3).
          required: [businessName, purpose, tone, timezone, uiLocale, replyLanguage, hours, escalation, capabilities, voices, collect]
          properties:
            businessName: { type: string, minLength: 1, maxLength: 120 }
            purpose: { type: string, maxLength: 2000 }
            tone: { type: string, enum: [professional, friendly, concise, formal] }
            timezone: { type: string, example: Asia/Karachi, description: 'IANA name; the hours are read in it.' }
            uiLocale: { type: string, enum: [en, ur] }
            replyLanguage: { type: string, enum: [en, ur] }
            hours:
              type: object
              nullable: true
              description: 'Per weekday (mon..sun) a list of [start, end] ranges in 24-hour HH:MM; no entry or an empty list means closed.'
              additionalProperties:
                type: array
                items:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            escalation:
              type: object
              description: Call forwarding to a person (the engine's handoff document).
              properties:
                enabled: { type: boolean }
                contacts:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      role: { type: string }
                      name: { type: string }
                      phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
                whenCallerAsks: { type: boolean }
                afterMisses: { type: integer, minimum: 1, maximum: 4 }
                topics: { type: array, maxItems: 10, items: { type: string, maxLength: 40 } }
                outsideHours: { type: string, enum: [callback, forward] }
                announce:
                  $ref: '#/components/schemas/LocalizedText200'
              additionalProperties: true
            capabilities: { type: object, additionalProperties: true }
            voices: { type: object, additionalProperties: { type: string }, description: 'Voice id per spoken language.' }
            collect:
              type: object
              nullable: true
              additionalProperties: true
              description: 'What the agent collects for a request - the engine''s document, opaque to the backend.'
            greeting:
              $ref: '#/components/schemas/LocalizedText400'
            recordCalls: { type: boolean, description: 'The owner switched call recording on for this agent (optional; absent = off).' }
            autoEndCalls: { type: boolean, description: 'The call ends by itself once the conversation is over (optional; the engine treats absent as on).' }
            endCallDelaySeconds: { type: integer, minimum: 2, maximum: 10, description: 'Seconds of quiet before the call ends by itself (optional; the engine treats absent as 3).' }
            profileSummary: { type: string, nullable: true, maxLength: 1200, description: 'The business summary the owner approved (optional; null or absent = none). The backend does not check for prices: that rule is the engine''s.' }
            profileSummarySources:
              type: array
              maxItems: 10
              description: 'The documents the summary was written from (optional; recorded by the engine).'
              items:
                type: object
                required: [id, title, hash]
                properties:
                  id: { type: string, maxLength: 100 }
                  title: { type: string, maxLength: 300 }
                  hash: { type: string, maxLength: 200 }
    LocalizedText400:
      type: object
      description: 'A text per spoken language; `{business}` is the engine''s only placeholder (the engine checks placeholders). A language that is left out or empty uses the engine''s built-in wording.'
      properties:
        en: { type: string, maxLength: 400 }
        ur: { type: string, maxLength: 400 }
      additionalProperties: false
    LocalizedText200:
      type: object
      description: 'The line said before a transfer, with `{name}` and `{role}`; empty or absent = the engine''s built-in line.'
      properties:
        en: { type: string, maxLength: 200 }
        ur: { type: string, maxLength: 200 }
      additionalProperties: false
    RequestType:
      type: string
      description: 'The three types the engine takes on a call (reference prefixes AP-, CB-, OR-). `order` was added in Phase 5B-3: dishes from the owner''s menu, pickup or delivery, in `data`; prices and the total are NOT in it (the team confirms them).'
      enum: [appointment, callback, order]
    RequestStatus:
      type: string
      description: |
        The workflow of Phase 5B-2 (src/requests/state-machine.ts). The engine only ever creates
        `requested` and may only cancel (withdraw) while it is `requested`. People move it:
        requested -> confirmed | cancelled; confirmed -> done | cancelled | requested; done ->
        confirmed; cancelled -> requested.
      enum: [requested, confirmed, done, cancelled]
    CreateRequest:
      type: object
      required: [reference, type, submissionKey, endCustomerId, summary]
      properties:
        agentId:
          type: string
          nullable: true
          description: The agent that took the call (default the tenant's default agent; null means the default, as in his `agentId ?? null`). One of another tenant answers 404 `AGENT_NOT_FOUND`.
        reference:
          type: string
          maxLength: 40
          example: AP-4K7Q2
          description: Made by the engine (AP-, CB-, OR- and five characters of his alphabet ABCDEFGHJKMNPQRSTUVWXYZ23456789), unique per tenant, short enough to read out on the phone. Stored upper case.
        type:
          $ref: '#/components/schemas/RequestType'
        submissionKey:
          type: string
          maxLength: 200
          description: Idempotency of the save, unique per tenant.
        endCustomerId:
          type: string
          description: From the customer upsert. Must be a customer of this tenant.
        conversationId:
          type: string
          nullable: true
          description: The engine's id of the call.
        channel:
          type: string
          enum: [voice, chat]
          default: voice
          description: 'His handoff also lists `whatsapp` "later"; it is refused (400) until the engine really sends it and the database allows it.'
        language:
          type: string
          nullable: true
          example: ur
        summary:
          type: string
          maxLength: 1000
          description: One or two lines for the staff screen.
        scheduledLocal:
          type: string
          nullable: true
          example: '2026-11-03 15:30'
          description: The business's wall-clock time as a string, on purpose (the engine does no time-zone arithmetic).
        timezone:
          type: string
          nullable: true
          example: Asia/Karachi
        configVersion:
          type: integer
          nullable: true
          description: 'The version of the agent settings the engine used for the call (the version of the config pull).'
        data:
          type: object
          additionalProperties: true
          description: |
            What the agent collected, already validated by the engine; the backend stores it (16 KB at most) and does not
            interpret it. An appointment: name, phone, service, datetime ...; an order: name, phone,
            `order_items` [{ id, name, qty }], `order_type` pickup or delivery, `address` (delivery only), notes - and no
            prices. Personal data: never logged.
    UpdateRequestDetails:
      type: object
      properties:
        summary: { type: string, maxLength: 1000 }
        scheduledLocal: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }
    RequestResult:
      type: object
      required: [id, reference, type, status, created]
      properties:
        id: { type: string }
        agentId: { type: string }
        reference: { type: string }
        type:
          $ref: '#/components/schemas/RequestType'
        status:
          $ref: '#/components/schemas/RequestStatus'
        created:
          type: boolean
          description: true for the call that saved it, false for a repeat of the same `submissionKey`.
    CustomerResult:
      type: object
      required: [endCustomerId, created]
      properties:
        endCustomerId: { type: string }
        created: { type: boolean }
    ErrorCodes:
      description: |
        Stable codes of this file (documentation only). All except `NUMBER_NOT_FOUND` (Phase 5D) are
        built and have en and ur texts in the backend.
      type: string
      enum:
        - TENANT_NOT_FOUND
        - AGENT_NOT_FOUND
        - AGENT_SETTINGS_VERSION_NOT_FOUND
        - CUSTOMER_NOT_FOUND
        - REQUEST_NOT_FOUND
        - REQUEST_LOCKED
        - REQUEST_REFERENCE_TAKEN
        - NUMBER_NOT_FOUND
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - SERVICE_UNAVAILABLE
        - TOO_MANY_REQUESTS
