openapi: 3.0.3
info:
  title: Backend internal API (called by the AI engine, voice-first) - DRAFT
  version: 0.1.0-draft
  description: |
    The routes of the backend core that the AI engine calls to ASK or COMMAND (the other direction
    of [engine-internal.openapi.yaml](engine-internal.openapi.yaml)), for the voice-first product
    (team-alignment L4, M1; Abdullah's duties B1, B4 and B11). The events the engine PUSHES are in
    [backend-events.openapi.yaml](backend-events.openapi.yaml) (`record.submitted`,
    `record.updated`, `usage.call_minutes` are acknowledged and ignored until the phases below).

    **Status: DRAFT written in Phase 5A (2026-10-21), extended in Phase 5B-1 (2026-10-28).
    Only `GET /internal/tenants/{tenantId}/agents/{agentId}/config` is implemented (Phase 5B-1);
    everything else in this file is a proposal that is not built, and Abdullah has not seen the file.**
    Every operation that is not built says so in its summary. The shapes
    follow what he described in his handoff (his names where known: `serviceable`, `reason`,
    `submissionKey`, `locked`) and are PROPOSALS where he did not say. Build order: the status
    check and the requests in Phase 5B, the number lookup in Phase 5D. Questions for him are
    collected under "Open questions" at the end of this description.

    Rules (the same as the engine contract, reversed):
    * **Private network only.** Never routed to the internet; the public API is `/v1`.
    * `Authorization: Bearer <INTERNAL_API_TOKEN>` (one long random secret per environment, the same
      one that signs the events), `X-Request-Id` for correlation. Wrong or missing token: 401. No
      token configured on the backend: 503.
    * **The tenant is in the path** (`/internal/tenants/{tenantId}/...`), because the engine learns it
      from the backend (`GET /internal/numbers/{e164}`) and states it on every call. The backend
      checks that the tenant exists and scopes every query to it; an id of another tenant in a body
      is never a way to reach that tenant's rows (a reference or an id of another tenant answers
      404).
    * **Agents (team-alignment L7, decided 2026-10-28).** A tenant has many agents (the tenant's own
      setup the one shared engine uses for a call: settings, knowledge, hours, greeting, voice,
      forwarding contacts), every number belongs to exactly one agent, and every tenant has one
      default agent. Every operation that concerns a call, a request or a customer carries
      `agentId`: in the path of the config route, as `?agentId=` on the status check, in the body
      of a request and of the customer upsert. The engine sends the same id as `X-Agent-Id` on its
      own routes and in its events (`agentId` in `data`). Until the engine is agent-aware (Q28) an
      absent `agentId` means "the tenant's default agent".
    * **The call ticket (Phase 5D, not built).** The backend receives the telephone provider's
      webhook first (L8), checks tenant and agent, and signs a one-minute single-use ticket that
      carries ONLY `tenantId`, `agentId` and `settingsVersion`. The engine's voice gateway
      verifies it and then PULLS the settings with `GET /internal/tenants/{tenantId}/agents/
      {agentId}/config?version={settingsVersion}`. The settings hold forwarding phone numbers, so
      they never travel in the ticket, a URL or through the provider. The signing is Phase 5D.
    * Commands carry `Idempotency-Key` where a repeat must be harmless; a request has its own
      `submissionKey` for that.
    * Errors have the shape `{ statusCode, code, message }`; codes are stable upper-case words.
    * Ids are text UUIDs, timestamps ISO-8601 UTC, money integer minor units.
    * Nothing here carries what a caller said beyond the fields named below, and the backend never
      logs request details or phone numbers.

    **Open questions for the engine owner (all proposals):**
    1. The status check: which `reason` should a tenant get whose plan has no voice (only possible
       through an override) or whose payment is overdue (`past_due` keeps serving within the plan,
       like chat, I5)? Today: `quota_exceeded` only when the call minutes are used up and the owner
       turned overage off; `unpaid` is reserved and never answered.
    2. The status is cached by the engine for about 60 seconds, so calls that start inside that
       window can overshoot the minute allowance a little. Acceptable (a soft limit)?
    3. The request body: is `data` free-form JSON validated by the engine only? Should
       `record.submitted` carry the details, or ids and the reference only (proposed)?
    4. A caller's phone number as the identity of an end customer (privacy rules, F1): the backend
       proposes to store it as the end customer's external id and show staff the number.
    5. Who calls the daily retention purge route of the engine (the backend's hourly job, proposed).
tags:
  - name: agents
  - name: status
  - name: requests
  - name: customers
  - name: numbers
servers:
  - url: http://backend.internal:3000
    description: Private address of the backend. Both services default to port 3000 - run one of them elsewhere.
security:
  - internalToken: []
paths:
  /internal/tenants/{tenantId}/agents/{agentId}/config:
    get:
      tags: [agents]
      summary: 'The settings of an agent, pulled by the engine at the start of every call (L7; IMPLEMENTED in Phase 5B-1)'
      description: |
        **Built.** The backend owns each agent's settings and versions them; the engine pulls the
        current version at the start of every call (a browser test call too) and may keep it for up
        to 60 seconds (`Cache-Control: private, max-age=60`; if the backend is briefly unreachable
        it may serve the copy it holds for that version).

        * `Authorization: Bearer <INTERNAL_API_TOKEN>`, compared in constant time. No token
          configured on the backend: 503. Wrong or missing: 401.
        * The tenant is the path segment and the agent must belong to it. An agent of another
          tenant, an unknown agent and an unknown tenant all answer the same **404
          `AGENT_NOT_FOUND`**.
        * `?version=n` returns that past version of the agent's settings (the version a call
          ticket names); an unknown one is 404 `AGENT_SETTINGS_VERSION_NOT_FOUND`, a malformed one
          400. Without it, the current (highest) version.
        * A **disabled** agent answers **200** with `status: "disabled"` (and its settings), so the
          engine can play the "not available" message and take no call.
        * `ETag` changes with the version and the status; an `If-None-Match` that matches answers
          **304** with no body.
        * Rate limited per tenant (600 a minute): 429 with `Retry-After`.
        * The body holds forwarding phone numbers: neither side logs it.

        `config` is the document in the engine's shape (the backend stores it, checks its structure
        when staff save it and does not interpret `collect`).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/RequestId'
        - name: version
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: A past settings version to read instead of the current one.
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The agent's settings
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: 'private, max-age=60' } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfig'
              examples:
                active:
                  value:
                    tenantId: 2f1c0c3e-6f0b-4a35-9c58-1f3c8c1d0001
                    agentId: 8c1d2b6e-0a3f-4c44-8d5e-5d0f7a9b0002
                    version: 3
                    status: active
                    config:
                      businessName: Acme Dental
                      purpose: Answer calls and take appointment requests.
                      tone: friendly
                      timezone: Asia/Karachi
                      uiLocale: en
                      replyLanguage: ur
                      hours:
                        mon: [['09:00', '17:00']]
                        tue: [['09:00', '17:00']]
                        wed: [['09:00', '17:00']]
                        thu: [['09:00', '17:00']]
                        fri: [['09:00', '17:00']]
                        sat: []
                        sun: []
                      escalation:
                        enabled: true
                        contacts: [{ id: c1, role: Senior doctor, name: Dr Ayesha, phone: '+923001234567' }]
                        whenCallerAsks: true
                        afterMisses: 2
                        topics: [emergency]
                        outsideHours: callback
                      capabilities: {}
                      voices: {}
                      collect: null
        '304':
          description: Unchanged since the `ETag` the engine sent (no body)
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/status:
    get:
      tags: [status]
      summary: '[DRAFT, not implemented] May this business and agent be served right now? (his B1; Phase 5B-2)'
      description: |
        Asked by the engine before it serves a call for the tenant; it caches the answer for about
        60 seconds and answers its own caller accordingly (403, 429 or 404). Derived by the backend
        from the EFFECTIVE subscription and the entitlements (`callMinutes`, `voice`):

        | `reason` | When |
        |---|---|
        | `suspended` | the tenant is suspended or its account is closed |
        | `quota_exceeded` | the plan's included call minutes are used up and overage does not apply (the plan has no minute price, the owner switched overage off, or a payment is overdue) |
        | `unpaid` | reserved; never answered today (a tenant that does not renew falls to Free after the grace period, and during the grace period it is served within its plan) |
        | `unknown_tenant` | no such tenant |
        | `null` | `serviceable: true` |

        `?agentId=` names the agent the call is for (default: the tenant's default agent). A
        disabled agent is `serviceable: false` with `reason: agent_disabled`; an unknown agent, or
        one that belongs to another tenant, is `reason: unknown_agent` (the same answer for both).

        An unknown tenant is a normal **200** with `reason: unknown_tenant` and `plan: null`: the
        answer leaks nothing about other tenants and the engine can cache it like any other.
        Whether one more minute may be served is `EntitlementsService.check(tenant, 'callMinutes')`:
        a tenant that used exactly its included minutes is no longer serviceable (or, with overage
        on, still serviceable and billed per extra minute).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdQuery'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The answer (also for an unknown tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStatus'
              examples:
                serviceable:
                  value: { tenantId: 2f1c0c3e-6f0b-4a35-9c58-1f3c8c1d0001, agentId: 8c1d2b6e-0a3f-4c44-8d5e-5d0f7a9b0002, serviceable: true, reason: null, plan: pro }
                outOfMinutes:
                  value: { tenantId: 2f1c0c3e-6f0b-4a35-9c58-1f3c8c1d0001, agentId: 8c1d2b6e-0a3f-4c44-8d5e-5d0f7a9b0002, serviceable: false, reason: quota_exceeded, plan: free }
                unknown:
                  value: { tenantId: 00000000-0000-0000-0000-000000000000, agentId: null, serviceable: false, reason: unknown_tenant, plan: null }
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/requests:
    post:
      tags: [requests]
      summary: '[DRAFT, not implemented] Save a request the agent took on a call (his B4; Phase 5B-2)'
      description: |
        The AI never books, confirms or cancels anything (L1): it saves a request as `requested`
        and a person confirms it on the staff screen.

        Idempotent by `(tenant, submissionKey)`: the first call answers **201** with `created: true`;
        a repeat with the same key answers **200** with `created: false` and the stored request
        (nothing is changed or duplicated). The `reference` (for example `AP-4K7Q2`) is made by the
        engine, unique per tenant; a different request with a reference that is taken answers 409
        `REQUEST_REFERENCE_TAKEN`. The caller is an end customer of this tenant (`endCustomerId`
        from the customer upsert); one of another tenant answers 404 `CUSTOMER_NOT_FOUND`.
        On success the backend creates a notification for the team and a live update on the
        dashboard stream (Phase 5B); the engine also sends `record.submitted`.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResult'
        '200':
          description: The same `submissionKey` was saved before; the original request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/requests/{reference}:
    patch:
      tags: [requests]
      summary: '[DRAFT, not implemented] Change the details of a saved request (his B4; Phase 5B)'
      description: |
        The engine may change a request ONLY while it is `requested`. Once a person confirmed,
        completed or cancelled it, the answer is **409 `REQUEST_LOCKED`** (his word: `locked`) and
        nothing changes. The check is a conditional update on the status that was read, so a
        confirmation that happens at the same moment wins and the engine's update is refused.
        Emits `record.updated` (from the engine's side). A reference of another tenant answers 404.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequestDetails'
      responses:
        '200':
          description: The request after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/requests/{reference}/withdraw:
    post:
      tags: [requests]
      summary: '[DRAFT, not implemented] The caller withdraws a request (his B4; Phase 5B)'
      description: |
        Moves a `requested` request to `cancelled` (marked as withdrawn by the caller). Same
        locking rule as the update: 409 `REQUEST_LOCKED` once a person acted on it. Repeating it on
        a request that is already withdrawn answers 200 (idempotent).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
                  description: Short tag for the staff screen, not the caller's words.
      responses:
        '200':
          description: The request after withdrawing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResult'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /internal/tenants/{tenantId}/customers/by-phone:
    put:
      tags: [customers]
      summary: '[DRAFT, not implemented] Find or create the end customer for a caller number (his B4, L4.3; Phase 5B-2)'
      description: |
        The backend creates end customers (L4.3, M3.7). Upsert by the caller's number within the
        tenant: the first call creates the customer, later calls return the same `endCustomerId`.
        The name and language are only filled in when the customer has none yet. The number is
        personal data (F1): it is stored as the customer's external id, shown to staff, never
        logged and never put in a URL (it is in the body).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                agentId:
                  type: string
                  description: The agent whose call this is (default the tenant's default agent). An agent of another tenant answers 404 `AGENT_NOT_FOUND`.
                phone:
                  type: string
                  pattern: '^\+[1-9][0-9]{6,14}$'
                  example: '+923001234567'
                  description: E.164.
                name:
                  type: string
                  maxLength: 200
                locale:
                  type: string
                  example: ur
      responses:
        '200':
          description: The customer (existing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResult'
        '201':
          description: The customer (created now)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /internal/numbers/{e164}:
    get:
      tags: [numbers]
      summary: '[DRAFT, not implemented] [NOT NEEDED under backend-first routing (L8); kept only as a fallback] Which business and agent own this phone number? (his B11, our Q26; Phase 5D)'
      description: |
        **Not needed under backend-first routing (decided 2026-10-28, L8):** the backend receives
        the telephone provider's webhook itself, maps the number to (tenant, agent) and hands the
        engine a call ticket (see the rules above), so the engine never has to look a number up.
        This route is kept in the draft only as a fallback in case Abdullah keeps the design in
        which the engine receives the webhook; it is built only if that happens.

        Asked by the engine after it verified the telephone provider's webhook signature (or after
        it accepted the backend's call ticket), so the tenant is never taken from what a caller
        supplies. The `+` of the number must be sent as `%2B` in the path. An unknown or inactive
        number answers 404 `NUMBER_NOT_FOUND` and reveals nothing else.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: e164
          in: path
          required: true
          schema:
            type: string
            pattern: '^\+[1-9][0-9]{6,14}$'
          example: '%2B923001234567'
      responses:
        '200':
          description: The tenant that owns the number
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, agentId]
                properties:
                  tenantId: { type: string }
                  agentId: { type: string, description: 'The one agent the number is linked to (L7).' }
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      description: INTERNAL_API_TOKEN, one long random secret per environment, shared by backend and engine.
  parameters:
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema: { type: string }
      description: The agent (the tenant's own setup) the call is for. It must belong to the tenant in the path.
    AgentIdQuery:
      name: agentId
      in: query
      required: false
      schema: { type: string }
      description: The agent the call is for; default the tenant's default agent.
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
      description: The tenant the call is about (an id the backend gave the engine).
    Reference:
      name: reference
      in: path
      required: true
      schema: { type: string, example: AP-4K7Q2 }
      description: The request's reference, unique per tenant.
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string }
      description: Correlation id; include it in every log line.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
      description: Makes a command safe to repeat. Scoped to the tenant.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [statusCode, code, message]
      properties:
        statusCode: { type: integer }
        code:
          type: string
          example: REQUEST_LOCKED
        message: { type: string }
    TenantStatus:
      type: object
      required: [tenantId, agentId, serviceable, reason, plan]
      properties:
        tenantId: { type: string }
        agentId:
          type: string
          nullable: true
          description: The agent the answer is about (the default agent when none was asked for); null for an unknown tenant.
        serviceable: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [suspended, unpaid, quota_exceeded, agent_disabled, unknown_agent, unknown_tenant, null]
        plan:
          type: string
          nullable: true
          example: pro
          description: The plan code (`starter`, `free`, `pro`, `enterprise`); null for an unknown tenant.
    AgentConfig:
      type: object
      required: [tenantId, agentId, version, status, config]
      properties:
        tenantId: { type: string }
        agentId: { type: string }
        version: { type: integer, minimum: 1, description: 'The settings version this config is.' }
        status:
          type: string
          enum: [active, disabled]
        config:
          type: object
          additionalProperties: false
          description: |
            The engine's document (its agent_configs fields). The backend checks the structure
            when staff save it; the checklist collect, the capabilities and the voice ids are
            validated by the engine and stored as they are.
          required: [businessName, purpose, tone, timezone, uiLocale, replyLanguage, hours, escalation, capabilities, voices, collect]
          properties:
            businessName: { type: string, minLength: 1, maxLength: 120 }
            purpose: { type: string, maxLength: 2000 }
            tone: { type: string, enum: [professional, friendly, concise, formal] }
            timezone: { type: string, example: Asia/Karachi, description: 'IANA name; the hours are read in it.' }
            uiLocale: { type: string, enum: [en, ur] }
            replyLanguage: { type: string, enum: [en, ur] }
            hours:
              type: object
              nullable: true
              description: 'Per weekday (mon..sun) a list of [start, end] ranges in 24-hour HH:MM; no entry or an empty list means closed.'
              additionalProperties:
                type: array
                items:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
            escalation:
              type: object
              description: Call forwarding to a person (the engine's handoff document).
              properties:
                enabled: { type: boolean }
                contacts:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      role: { type: string }
                      name: { type: string }
                      phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
                whenCallerAsks: { type: boolean }
                afterMisses: { type: integer, minimum: 1, maximum: 4 }
                topics: { type: array, maxItems: 10, items: { type: string, maxLength: 40 } }
                outsideHours: { type: string, enum: [callback, forward] }
            capabilities: { type: object, additionalProperties: true }
            voices: { type: object, additionalProperties: { type: string }, description: 'Voice id per spoken language.' }
            collect:
              type: object
              nullable: true
              additionalProperties: true
              description: 'What the agent collects for a request - the engine''s document, opaque to the backend.'
    RequestType:
      type: string
      enum: [appointment, callback]
    RequestStatus:
      type: string
      description: The workflow of Phase 5B. The engine only ever creates `requested`.
      enum: [requested, confirmed, done, cancelled]
    CreateRequest:
      type: object
      required: [reference, type, submissionKey, endCustomerId, summary]
      properties:
        agentId:
          type: string
          description: The agent that took the call (default the tenant's default agent). One of another tenant answers 404 `AGENT_NOT_FOUND`.
        reference:
          type: string
          maxLength: 40
          example: AP-4K7Q2
          description: Made by the engine, unique per tenant, short enough to read out on the phone.
        type:
          $ref: '#/components/schemas/RequestType'
        submissionKey:
          type: string
          maxLength: 200
          description: Idempotency of the save, unique per tenant.
        endCustomerId:
          type: string
          description: From the customer upsert. Must be a customer of this tenant.
        conversationId:
          type: string
          description: The engine's id of the call.
        channel:
          type: string
          enum: [voice, widget]
          default: voice
        language:
          type: string
          example: ur
        summary:
          type: string
          maxLength: 1000
          description: One or two lines for the staff screen.
        scheduledLocal:
          type: string
          nullable: true
          example: '2026-11-03 15:30'
          description: The business's wall-clock time as a string, on purpose (the engine does no time-zone arithmetic).
        timezone:
          type: string
          example: Asia/Karachi
        configVersion:
          type: integer
          description: The version of the agent settings the engine used (the settingsVersion of the call ticket).
        data:
          type: object
          additionalProperties: true
          description: What the agent collected (name, service, notes ...), already validated by the engine; the backend stores it and does not interpret it.
    UpdateRequestDetails:
      type: object
      properties:
        summary: { type: string, maxLength: 1000 }
        scheduledLocal: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }
    RequestResult:
      type: object
      required: [id, reference, type, status, created]
      properties:
        id: { type: string }
        agentId: { type: string }
        reference: { type: string }
        type:
          $ref: '#/components/schemas/RequestType'
        status:
          $ref: '#/components/schemas/RequestStatus'
        created:
          type: boolean
          description: true for the call that saved it, false for a repeat of the same `submissionKey`.
    CustomerResult:
      type: object
      required: [endCustomerId, created]
      properties:
        endCustomerId: { type: string }
        created: { type: boolean }
    ErrorCodes:
      description: |
        Proposed stable codes of this file (documentation only). They need en and ur texts in the
        backend when they are built.
      type: string
      enum:
        - TENANT_NOT_FOUND
        - AGENT_NOT_FOUND
        - AGENT_SETTINGS_VERSION_NOT_FOUND
        - CUSTOMER_NOT_FOUND
        - REQUEST_NOT_FOUND
        - REQUEST_LOCKED
        - REQUEST_REFERENCE_TAKEN
        - NUMBER_NOT_FOUND
        - VALIDATION_ERROR
        - UNAUTHORIZED
