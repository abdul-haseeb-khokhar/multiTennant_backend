openapi: 3.0.3
info:
  title: Backend event receiver (called by the AI engine, Phase 4)
  version: 0.1.0-draft
  description: |
    The route of the backend that the AI engine calls to PUSH events (team-alignment D5). The routes
    the engine calls to ASK or COMMAND the backend (tenant status check, requests, customer upsert,
    number lookup) are in `backend-internal.openapi.yaml`.

    **Status (Phase 5A, 2026-10-21): proposed by the backend; Abdullah has agreed in principle to
    signed events from a database outbox with retries under the same event id (M1, Q15 to Q17), but
    he has not built or confirmed the payloads below.** Which parts are agreed and which are still
    proposals is marked per event type under `Events`. Until the engine implements it, the backend's
    in-process mock engine (`ENGINE_MODE=mock`) delivers the very same events straight to the same
    code that handles this route, so the dashboard, the notifications and the widget stream already
    work end to end, and a simulated phone call produces the voice-first events (`/call`, see
    `docs/contracts/README.md`).

    **Voice-first (L1, decided 2026-10-21).** The product is an AI phone receptionist; the engine's
    real events today are `record.submitted` and `record.updated` (a request was saved or changed,
    M2.4) and, proposed, `usage.call_minutes`. Since Phase 5B-2 the backend HANDLES `record.submitted`
    and `record.updated` (stored once in the inbox, idempotent by event id; the request itself arrives
    through the routes of `backend-internal.openapi.yaml`, so the event only makes sure the team was
    told) and still ACKNOWLEDGES `usage.call_minutes` (200 `ignored`, nothing stored) until Phase 5E
    (call usage). None of this is confirmed by the engine owner. The chat
    events (`conversation.*`, `message.created`, `usage.recorded`) keep working but chat is halted
    (L2): no new work. `action.proposed` is **unused** since L3 (approvals dropped).

    This route is **outside `/v1`** on purpose: it is service-to-service, not part of the public API
    the frontend consumes (it is not in `docs/openapi.json`), and it must be reachable only on the
    private network (a reverse proxy must not route `/internal/*` to the internet).

    **Authentication (D2, D5): a signature, so the service token is never sent.** The engine signs
    each request with the shared `INTERNAL_API_TOKEN`:

    ```
    X-Engine-Timestamp: <unix seconds when the request is built>
    X-Engine-Signature: sha256=<hex of HMAC-SHA256(INTERNAL_API_TOKEN, "<timestamp>.<raw request body>")>
    ```

    The timestamp must be within 5 minutes of the backend's clock (a captured request cannot be
    replayed later; replays inside the window are harmless because delivery is idempotent). Compare
    over the exact bytes of the body that was sent.

    **Delivery rules**
    * `tenantId` of the **envelope** is the only tenant the backend uses. Ids inside `data` are
      never trusted to name a tenant, and every lookup the backend does for an event is scoped to
      the envelope's tenant. An unknown tenant answers 404 `TENANT_NOT_FOUND`.
    * `id` is unique per event. Sending the same `(tenantId, id)` again is safe: the backend
      answers 200 `duplicate` and does nothing. **Retry on any non-2xx answer and on a timeout**
      (the backend commits the event before it answers, so a retry after a lost answer is a no-op).
    * An event type the backend does not know is acknowledged (200 `ignored`) and logged, never
      refused, so the engine can add event types before the backend learns them. The same goes for
      the voice-first types listed under `Events` as "acknowledged until Phase 5B / 5E": they are
      not stored in the backend's inbox either, so after the phase that handles them exists, an
      outbox re-delivery is processed instead of answered `duplicate`.
    * Order is not guaranteed across retries; every handler is written so that a late event only
      refreshes state (the dashboard re-reads by id).
    * Message text travels only where a customer may see it: `message.created` of a human or
      system line carries `content`/`contentKey`; customer and AI messages carry ids only.
servers:
  - url: http://backend.internal:3000
    description: Private address of the backend
paths:
  /internal/events:
    post:
      summary: Deliver one event
      parameters:
        - name: X-Engine-Timestamp
          in: header
          required: true
          schema: { type: string, example: '1760000000' }
        - name: X-Engine-Signature
          in: header
          required: true
          schema: { type: string, example: 'sha256=3f5a...' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Envelope'
      responses:
        '200':
          description: Accepted (or a duplicate / an event type the backend ignores)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [processed, duplicate, ignored]
        '400':
          description: The envelope is malformed (VALIDATION_ERROR)
        '401':
          description: Missing, wrong or stale signature (UNAUTHORIZED)
        '404':
          description: The envelope's tenant does not exist (TENANT_NOT_FOUND)
        '503':
          description: The backend has no INTERNAL_API_TOKEN configured
components:
  schemas:
    Envelope:
      type: object
      required: [id, type, tenantId, occurredAt, data]
      properties:
        id:
          type: string
          maxLength: 100
          description: Unique per event (a UUID).
        type:
          type: string
          example: conversation.escalated
        tenantId:
          type: string
          description: The tenant the event belongs to. The only tenant the backend uses.
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          description: Payload by event type, see below.
    Events:
      description: |
        Documentation only: the `data` payload of each event type the backend handles.
        Ids are the engine's; `endCustomerId` and every user id are the backend's ids.

        Status of each type: the `conversation.*`, `message.created` and `usage.recorded` payloads
        are the backend's proposals from Phases 3 and 4 (chat, halted by L2), not confirmed by the
        engine owner. `record.submitted`, `record.updated` and `usage.call_minutes` are the
        voice-first events (names from Abdullah's documents, M2.4 / his B8; payload fields are
        PROPOSED here, ids and references only, never what the caller said). The two `record.*`
        events are handled since Phase 5B-2, `usage.call_minutes` is acknowledged until Phase 5E.
      type: object
      properties:
        record.submitted:
          description: >-
            HANDLED since Phase 5B-2 (recorded in the inbox, idempotent by event id). The AI saved a
            request (an appointment, a call-back or an order) for a caller; staff confirm it. The request
            ITSELF is created by the engine's call to `POST /internal/tenants/{tenantId}/requests`
            (the source of truth, it carries the details); this event never creates a request. The
            backend looks the request up under the ENVELOPE's tenant, by `recordId` (the id the
            create call returned) or else by `reference`, and makes sure the team has been told:
            one `request.submitted` notification per active staff member and one `request.created`
            live update, both once-only through dedupe keys, so the route and the event never double
            up. An event for a request the backend does not have, or one of another tenant, is
            processed without any effect (logged without the reference). A missing `recordId` and
            `reference` is a 400. Ids and the reference only (open question for the engine owner:
            should the event carry the details too?). **Payload as the engine hand-off lists it
            (B7, read 2026-10-29): `{ recordId, recordType, reference, agentId, conversationId }`**;
            only `recordId` and `reference` are read (an id that is no request of the tenant falls back
            to the reference), every other field is ignored, so extra fields and nulls are fine.
          type: object
          anyOf:
            - required: [recordId]
            - required: [reference]
          properties:
            recordId: { type: string, description: 'The id the backend returned when the engine created the request.' }
            reference:
              type: string
              example: AP-4K7Q2
              description: Unique per tenant, short enough to read out on the phone.
            recordType: { type: string, enum: [appointment, callback, order], description: 'His field name (ignored by the backend, which reads the type from the request it holds).' }
            type: { type: string, enum: [appointment, callback, order], description: 'Our earlier name for recordType; ignored.' }
            agentId: { type: string, nullable: true, description: 'The agent that took the call (L7); null means the default agent. Ignored (the request holds it).' }
            conversationId: { type: string, nullable: true }
            endCustomerId: { type: string, nullable: true }
            channel: { type: string, enum: [voice, chat] }
        record.updated:
          description: >-
            HANDLED since Phase 5B-2 (recorded in the inbox). The engine changed the details of a
            request or the caller withdrew it (the change itself was made by the engine's call to
            `PATCH …/requests/{reference}` or `POST …/withdraw`). The engine may do so only while
            the request is `requested`; once staff confirmed it, the engine's update is refused
            (409 `REQUEST_LOCKED`) and no event is sent. The backend only publishes a live update
            `request.updated` to the tenant's dashboard stream (the backend's own current status,
            not the one in the event); no notification. Lookup as for `record.submitted`.
            **Payload as the engine hand-off lists it (B7): `{ recordId, status, detailsChanged? }`
            (no `reference`)**; `status` and `detailsChanged` are ignored (the live update carries the
            backend's own status).
          type: object
          anyOf:
            - required: [recordId]
            - required: [reference]
          properties:
            recordId: { type: string }
            reference: { type: string, description: 'Optional (his event has none); used only when no request has this recordId.' }
            status: { type: string, enum: [requested, confirmed, done, cancelled], description: 'His status at the time; ignored.' }
            detailsChanged: { type: boolean, description: 'His flag that the details changed; ignored.' }
            type: { type: string, enum: [appointment, callback, order] }
            agentId: { type: string, nullable: true, description: 'The agent the request belongs to (L7).' }
            conversationId: { type: string, nullable: true }
            revision: { type: integer, description: How many times the details changed. }
        handoff.requested:
          description: >-
            **ACKNOWLEDGED AND IGNORED (200 `ignored`)**, no new feature (Phase 5B-3). The engine passed a
            caller to a person. Today the backend does nothing with it: it is not a handled type, so the
            delivery is stored once in the inbox (idempotent by event id), logged by type and tenant only
            (never the data) and answered `ignored`. A phase that shows call history (5E) may use it;
            when it does, deliveries that arrived before are in the inbox and a re-delivery would answer
            `duplicate`, so list it under the pending types first if that matters.
          type: object
          properties:
            conversationId: { type: string }
            agentId: { type: string, nullable: true }
            channel: { type: string, enum: [voice, chat] }
            reason: { type: string, enum: [asked, topic, not_understood, frustrated] }
            contactId: { type: string, nullable: true, description: 'Which of the agent''s forwarding contacts (an id inside the settings document); never a number.' }
        handoff.unavailable:
          description: >-
            **ACKNOWLEDGED AND IGNORED (200 `ignored`)**, as `handoff.requested`: a person was needed but
            the business was closed (`contactId` null).
          type: object
          properties:
            conversationId: { type: string }
            agentId: { type: string, nullable: true }
            channel: { type: string, enum: [voice, chat] }
            reason: { type: string }
            contactId: { type: string, nullable: true }
        usage.call_minutes:
          description: >-
            ACKNOWLEDGED UNTIL PHASE 5E (200 `ignored`, nothing stored). A call ended: its length in
            seconds. Phase 5E will count it once per `conversationId` into `usage_daily.call_minutes`
            through the usage ledger (the shape is Abdullah's proposal from his B8; how seconds
            become whole billed minutes, proposal: each call rounded UP to the next minute, is
            decided then).
          type: object
          required: [conversationId, seconds]
          properties:
            conversationId: { type: string, description: The call. One call counts once. }
            agentId: { type: string, nullable: true, description: 'The agent that took the call (L7). Minutes stay pooled per tenant; the agent only allows a per-agent breakdown (Phase 5E).' }
            seconds: { type: integer, minimum: 0 }
            channel: { type: string, enum: [voice, widget] }
        conversation.created:
          type: object
          required: [conversationId]
          properties:
            conversationId: { type: string }
            endCustomerId: { type: string, nullable: true }
            channel: { type: string, enum: [widget, whatsapp, voice] }
            agentId: { type: string, nullable: true, description: 'The agent the conversation belongs to (L7); null for a chat conversation or until the engine is agent-aware.' }
        conversation.escalated:
          description: >-
            The conversation needs a human. All active staff get a notification and the queue refreshes.
          type: object
          required: [conversationId, reason]
          properties:
            conversationId: { type: string }
            endCustomerId: { type: string, nullable: true }
            reason:
              type: string
              enum: [customer_requested, low_confidence, failed_action, sentiment, topic, outside_hours, ai_unavailable, limit_reached, other]
            summary: { type: string }
        conversation.assigned:
          description: >-
            A staff member now holds the conversation. The assignee gets a notification unless they
            assigned it to themselves (assignedByUserId equals assignedUserId, a plain claim).
          type: object
          required: [conversationId, assignedUserId]
          properties:
            conversationId: { type: string }
            assignedUserId: { type: string }
            assignedByUserId: { type: string }
        conversation.released:
          description: >-
            `to` is only `active` or `escalated`: releasing to `resolved` is the same as resolving and
            sends `conversation.resolved` (agreed with the engine owner, M1).
          type: object
          required: [conversationId, to]
          properties:
            conversationId: { type: string }
            to: { type: string, enum: [active, escalated] }
            previousUserId: { type: string, nullable: true }
            reason: { type: string }
        conversation.resolved:
          type: object
          required: [conversationId, resolvedBy]
          properties:
            conversationId: { type: string }
            resolvedBy: { type: string, enum: [ai, human, customer, system] }
        message.created:
          type: object
          required: [conversationId, messageId, authorType]
          properties:
            conversationId: { type: string }
            messageId: { type: string }
            authorType: { type: string, enum: [customer, ai, human, system, tool] }
            createdAt: { type: string, format: date-time }
            content:
              type: string
              description: Only for `human` and `system` messages.
            contentKey:
              type: string
              nullable: true
              description: Only for `system` lines, a key of the `widget` translation namespace, for example `agent.joined`.
            authorUserId: { type: string, nullable: true }
        usage.recorded:
          description: >-
            Tokens of one assistant message. Counted once per message id (the gateway may have counted it already from the reply stream).
          type: object
          required: [conversationId, messageId, tokensIn, tokensOut]
          properties:
            conversationId: { type: string }
            messageId: { type: string }
            tokensIn: { type: integer }
            tokensOut: { type: integer }
            model: { type: string }
        action.proposed:
          description: >-
            UNUSED since 2026-10-21 (L3: risky-action approvals are dropped and the engine executes no
            actions). The backend still handles it (owners and admins get a notification) so an
            engine that sends it is not surprised; do not build on it.
          type: object
          required: [actionId]
          properties:
            actionId: { type: string }
            conversationId: { type: string }
            action:
              type: string
              description: Short action name shown in the notification, for example `refund`.
        'action.executed, call.ended, ingestion.completed, ingestion.failed':
          description: Reserved (later phases). Acknowledged and ignored today.
          type: object
